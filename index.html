<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atlas">
<meta name="theme-color" content="#04050a">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Atlas</title>
<meta name="color-scheme" content="dark">
<style>
  :root {
    color-scheme: dark;
    --bg: #04050a;
    --ink: #f5f5f7;
    --ink2: rgba(235, 235, 245, .64);
    --ink3: rgba(235, 235, 245, .38);
    --hair: rgba(255, 255, 255, .09);
    --s1: #3987e5;   /* spending */
    --s2: #d95926;   /* bills */
    --s3: #199e70;   /* everyday / income */
    --s4: #c98500;   /* calendar plans */
    --good: #30d158;
    --bad: #ff6961;
    --warn: #ffb340;
    --radius: 26px;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; letter-spacing: -.01em;
    min-height: 100vh; overflow-x: hidden;
  }
  .num { font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }

  /* ambient light behind the glass */
  .ambient { position: fixed; inset: -20%; z-index: 0; pointer-events: none; filter: blur(60px); opacity: .9; }
  .ambient i { position: absolute; border-radius: 50%; }
  .ambient i:nth-child(1) { width: 60vmax; height: 60vmax; left: -10%; top: -15%; background: radial-gradient(closest-side, rgba(57,135,229,.45), transparent); animation: drift 22s ease-in-out infinite alternate; }
  .ambient i:nth-child(2) { width: 55vmax; height: 55vmax; right: -15%; top: 25%; background: radial-gradient(closest-side, rgba(120,80,220,.35), transparent); animation: drift 28s ease-in-out infinite alternate-reverse; }
  .ambient i:nth-child(3) { width: 50vmax; height: 50vmax; left: 10%; bottom: -20%; background: radial-gradient(closest-side, rgba(25,158,112,.28), transparent); animation: drift 25s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(6%, 8%) scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { .ambient i { animation: none; } * { transition-duration: 0s !important; } }

  /* liquid glass */
  .glass {
    position: relative;
    background: linear-gradient(160deg, rgba(255,255,255,.11), rgba(255,255,255,.035) 55%, rgba(255,255,255,.06));
    -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(255,255,255,.05), 0 12px 40px rgba(0,0,0,.45);
    border-radius: var(--radius);
  }
  .glass::after { /* specular rim */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,.18), transparent 28%, transparent 72%, rgba(255,255,255,.06));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    padding: 1px;
  }

  .app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: 18px 16px 130px; }
  header.top { display: flex; align-items: flex-end; justify-content: space-between; margin: 6px 4px 18px; min-height: 58px; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--ink2); text-transform: uppercase; letter-spacing: .04em; }
  h1 { font-size: 34px; line-height: 1.05; font-weight: 700; letter-spacing: -.025em; margin: 2px 0 0; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }

  .screen { display: none; animation: rise .45s var(--ease); }
  .screen.on { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  section.panel { padding: 18px; margin-bottom: 14px; }
  .ph { display: flex; flex-wrap: wrap; gap: 2px 10px; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .ph h2 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: -.015em; }
  .ph .aside { font-size: 13px; color: var(--ink2); }
  .muted { color: var(--ink2); } .faint { color: var(--ink3); }
  .small { font-size: 13px; }

  /* ---------- card stack ---------- */
  .stack { position: relative; margin: 0 0 18px; transition: height .55s var(--ease); }
  .card {
    position: absolute; left: 0; right: 0; aspect-ratio: 1.586; border-radius: 20px; padding: 18px 20px;
    display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; color: #fff;
    box-shadow: 0 -1px 0 rgba(255,255,255,.25) inset, 0 18px 40px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
    transition: top .55s var(--ease), transform .55s var(--ease), opacity .4s var(--ease);
    cursor: pointer; will-change: top, transform;
  }
  .card::before { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.28), rgba(255,255,255,0) 38%), radial-gradient(120% 80% at 100% 100%, rgba(255,255,255,.10), transparent 60%); pointer-events: none; }
  .card.light { color: #1c1c1e; }
  .card .row { display: flex; justify-content: space-between; align-items: flex-start; position: relative; }
  .card .cname { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
  .card .ckind { font-size: 12px; font-weight: 600; opacity: .7; text-transform: uppercase; letter-spacing: .06em; }
  .card .lab { font-size: 11px; font-weight: 600; opacity: .7; text-transform: uppercase; letter-spacing: .06em; }
  .card .bal { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
  .card .mo { font-size: 17px; font-weight: 650; text-align: right; }
  .card .chip { width: 34px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,.15)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); }
  .card.dim { transform: translateY(40px) scale(.9); opacity: 0; pointer-events: none; }

  .detail-head { display: flex; gap: 10px; margin-bottom: 14px; }
  .detail-head > div { flex: 1; padding: 14px 16px; border-radius: 20px; }
  .kpi-l { font-size: 12px; color: var(--ink2); font-weight: 600; }
  .kpi-v { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
  .note { font-size: 13px; color: var(--ink2); padding: 0 6px 12px; }

  /* ---------- month tile ---------- */
  .hero-num { font-size: 44px; font-weight: 700; letter-spacing: -.035em; line-height: 1; }
  .hero-sub { font-size: 15px; color: var(--ink2); margin-top: 6px; }
  .meter { position: relative; height: 10px; border-radius: 6px; background: rgba(255,255,255,.08); margin: 18px 0 10px; }
  .meter .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--s1); transition: width .8s var(--ease); }
  .meter .tick { position: absolute; top: -5px; bottom: -5px; width: 2px; border-radius: 1px; background: var(--ink); }
  .meter .tick.proj { background: none; border-left: 2px dashed var(--ink2); width: 0; }
  .meter-legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink2); flex-wrap: wrap; }
  .meter-legend span::before { content: ""; display: inline-block; width: 10px; height: 2px; vertical-align: middle; margin-right: 5px; background: var(--ink); }
  .meter-legend span.p::before { background: none; border-top: 2px dashed var(--ink2); height: 0; }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  .stats3 div { padding: 12px; border-radius: 16px; background: rgba(255,255,255,.05); }
  .stats3 b { display: block; font-size: 18px; letter-spacing: -.02em; }
  .stats3 span { font-size: 12px; color: var(--ink2); }
  .link-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--hair); font-size: 15px; text-align: left; }
  .link-row > span:last-child { display: flex; align-items: center; white-space: nowrap; }
  .link-row .lr-sub { display: block; font-size: 13px; color: var(--ink2); }
  .chev::after { content: "›"; font-size: 22px; color: var(--ink3); margin-left: 6px; line-height: 0; }

  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 650; padding: 5px 10px; border-radius: 999px; }
  .status.good { color: var(--good); background: rgba(48,209,88,.14); }
  .status.bad { color: var(--bad); background: rgba(255,105,97,.14); }

  /* ---------- transactions ---------- */
  .tx { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--hair); }
  .tx:first-child { border-top: 0; padding-top: 2px; }
  .av { flex: 0 0 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 19px; background: rgba(255,255,255,.08); box-shadow: inset 0 1px 0 rgba(255,255,255,.12); }
  .tx .mid { flex: 1; min-width: 0; }
  .tx .m { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .s { font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .amt { font-weight: 600; text-align: right; white-space: nowrap; }
  .tx .amt.in { color: var(--good); }
  .flag { color: var(--warn); font-weight: 600; }
  .more { display: block; width: 100%; text-align: center; padding: 12px 0 2px; color: var(--s1); font-weight: 600; border-top: 1px solid var(--hair); margin-top: 4px; }

  /* ---------- charts ---------- */
  .chart { position: relative; touch-action: pan-y; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink2); margin-bottom: 10px; }
  .legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .legend i.dash { height: 0; border-top: 2px dashed var(--ink3); background: none !important; }
  .legend i.sq { width: 10px; height: 10px; border-radius: 3px; }
  .tip { position: absolute; top: 0; pointer-events: none; padding: 8px 10px; border-radius: 12px; font-size: 12px; white-space: nowrap; opacity: 0; transition: opacity .15s; z-index: 3;
         background: rgba(30,31,38,.82); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.12); }
  .tip b { display: block; font-size: 13px; margin-bottom: 2px; }
  .tip .k { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .headline { font-size: 15px; margin: -4px 0 14px; color: var(--ink2); }
  .headline b { color: var(--ink); }

  .cat { padding: 10px 0; border-top: 1px solid var(--hair); }
  .cat:first-child { border-top: 0; padding-top: 0; }
  .cat .top { display: flex; align-items: center; gap: 10px; }
  .cat .nm { flex: 1; font-weight: 600; }
  .cat .val { font-weight: 600; }
  .cat .val span { color: var(--ink3); font-weight: 500; }
  .bar { height: 6px; border-radius: 4px; background: rgba(255,255,255,.08); margin: 8px 0 6px 40px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 4px; background: var(--s1); }
  .bar.over > div { background: var(--bad); }
  .cat .sub { margin-left: 40px; font-size: 12px; color: var(--ink2); }
  .cat .sub .up { color: var(--warn); } .cat .sub .down { color: var(--good); }
  .cat .em { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 9px; display: grid; place-items: center; background: rgba(255,255,255,.08); font-size: 15px; }

  .rank { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--hair); }
  .rank:first-child { border-top: 0; padding-top: 0; }
  .rank .n { width: 20px; color: var(--ink3); font-weight: 600; text-align: center; }

  /* ---------- forecast ---------- */
  .stackbar { position: relative; display: flex; gap: 2px; height: 16px; margin: 22px 0 8px; }
  .stackbar > div { height: 100%; transition: width .8s var(--ease); }
  .stackbar > div:first-child { border-radius: 5px 0 0 5px; } .stackbar > div:last-of-type { border-radius: 0 5px 5px 0; }
  .stackbar .budget { position: absolute; top: -8px; bottom: -8px; width: 2px; background: var(--ink); border-radius: 1px; }
  .stackbar .budget span { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--ink2); white-space: nowrap; }
  .brk { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--hair); }
  .brk:first-of-type { border-top: 0; }
  .brk .sw { width: 12px; height: 12px; border-radius: 4px; flex: 0 0 12px; }
  .brk .t { flex: 1; } .brk .t small { display: block; color: var(--ink2); font-size: 12px; }
  .brk b { font-weight: 650; }
  .dayhead { font-size: 13px; font-weight: 650; color: var(--ink2); text-transform: uppercase; letter-spacing: .04em; margin: 16px 0 4px; }
  .dayhead:first-child { margin-top: 0; }
  .tip-card { padding: 16px 18px; font-size: 14px; color: var(--ink2); }
  .tip-card b { color: var(--ink); }

  /* ---------- tab bar + add ---------- */
  .dock { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 14px); z-index: 20; display: flex; justify-content: center; gap: 10px; padding: 0 16px; pointer-events: none; }
  .tabs { display: flex; padding: 5px; border-radius: 999px; pointer-events: auto; }
  .tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 9px; border-radius: 999px; font-size: 10.5px; min-width: 54px; font-weight: 600; color: var(--ink2); transition: background .3s var(--ease), color .3s; }
  .tabs button svg { width: 24px; height: 24px; }
  .tabs button.on { color: var(--s1); background: rgba(255,255,255,.10); }
  .fab { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; pointer-events: auto; }
  .fab svg { width: 26px; height: 26px; }

  .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .35s var(--ease); }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-width: 520px; margin: 0 auto; padding: 10px 18px calc(env(safe-area-inset-bottom) + 22px);
           border-radius: 30px 30px 0 0; transform: translateY(105%); transition: transform .5s var(--ease); max-height: 92vh; overflow-y: auto;
           background: linear-gradient(180deg, rgba(40,42,52,.86), rgba(22,23,30,.94)); -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%);
           border-top: 1px solid rgba(255,255,255,.14); }
  .sheet.on { transform: none; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.25); margin: 0 auto 10px; }
  .sheet-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .sheet-top h3 { margin: 0; font-size: 17px; }
  .sheet-top button { color: var(--s1); font-weight: 600; font-size: 16px; padding: 6px; }
  .amount { width: 100%; background: none; border: 0; color: var(--ink); text-align: center; font-size: 56px; font-weight: 700; letter-spacing: -.03em; padding: 14px 0 10px; outline: none; font-variant-numeric: tabular-nums; }
  .amount::placeholder { color: var(--ink3); }
  .field { display: block; width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 13px 14px; margin-bottom: 10px; outline: none; -webkit-appearance: none; }
  .field:focus { border-color: rgba(57,135,229,.7); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .lbl { font-size: 13px; font-weight: 600; color: var(--ink2); margin: 8px 4px 8px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -18px; padding-left: 18px; padding-right: 18px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: 0 0 auto; padding: 9px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.08); color: var(--ink); }
  .chips button.on { background: var(--s1); border-color: transparent; }
  .save { width: 100%; padding: 16px; border-radius: 16px; font-size: 17px; font-weight: 700; background: var(--s1); color: #fff; margin-top: 8px; box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
  .save:disabled { opacity: .5; }
  .toast { position: fixed; top: 14px; left: 50%; transform: translate(-50%, -200%); opacity: 0; z-index: 40; padding: 12px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; transition: transform .45s var(--ease); white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
  .toast.on { transform: translate(-50%, 0); opacity: 1; }

  .sk { border-radius: 12px; background: linear-gradient(90deg, rgba(255,255,255,.05), rgba(255,255,255,.11), rgba(255,255,255,.05)); background-size: 200% 100%; animation: sk 1.3s linear infinite; }
  @keyframes sk { to { background-position: -200% 0; } }
  .err { padding: 18px; color: var(--bad); }

  /* ---------- activity ---------- */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; border-radius: 14px; margin-bottom: 12px; }
  .seg button { padding: 8px 0; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--ink2); transition: background .25s, color .25s; }
  .seg button.on { background: rgba(255,255,255,.16); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
  .pnav { display: flex; align-items: center; justify-content: space-between; margin: 2px 4px 12px; font-size: 17px; font-weight: 650; }
  .pnav button { width: 36px; height: 36px; border-radius: 50%; font-size: 24px; line-height: 1; color: var(--s1); background: rgba(255,255,255,.06); }
  .pnav button:disabled { opacity: .25; }
  .upc { color: var(--warn); } .downc { color: var(--good); } .negc, .neg { color: var(--bad); }
  .catrow { display: flex; gap: 12px; width: 100%; text-align: left; padding: 10px 0; border-top: 1px solid var(--hair); align-items: flex-start; }
  .catrow:first-of-type { border-top: 0; padding-top: 0; }
  .catrow.on .nm { color: var(--s1); }
  .catrow .cmid { flex: 1; display: block; }
  .catrow .crow { display: flex; justify-content: space-between; }
  .catrow .bar { display: block; margin: 6px 0 4px; }
  .linkb { color: var(--s1); font-weight: 600; }
  .sched .srow { display: grid; grid-template-columns: 1fr 120px 32px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .sched select { height: 40px; border-radius: 12px; background: rgba(255,255,255,.07); color: var(--ink); border: 1px solid rgba(255,255,255,.1); font: inherit; font-size: 15px; padding: 0 10px; -webkit-appearance: none; }
  .sched .money-in input { width: 100%; height: 40px; }
  .sx { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.08); color: var(--ink2); font-size: 13px; }
  .catwrap { border-top: 1px solid var(--hair); } .catwrap:first-of-type { border-top: 0; }
  .catwrap .catrow { border-top: 0; } .cchev::after { content: "›"; display: inline-block; color: var(--ink3); font-size: 20px; margin-left: 6px; transition: transform .25s var(--ease); }
  .catwrap.open .cchev::after { transform: rotate(90deg); }
  .catx { margin: 0 0 8px 42px; padding: 2px 10px; border-radius: 14px; background: rgba(255,255,255,.04); animation: rise .3s var(--ease); }
  /* ---------- plan ---------- */
  .sl { display: block; margin-bottom: 14px; }
  .slt { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 8px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.14); }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.14); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; margin-top: -11px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.4), inset 0 -2px 4px rgba(0,0,0,.08); }
  input[type=range]::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; border: 0; background: #fff; }
  .splithead, .split { display: grid; grid-template-columns: 34px 1fr 74px 60px; gap: 8px; align-items: center; }
  .splithead { font-size: 11px; color: var(--ink3); text-transform: uppercase; letter-spacing: .05em; text-align: right; margin-bottom: 4px; }
  .split { padding: 9px 0; border-top: 1px solid var(--hair); text-align: right; }
  .split .em { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: rgba(255,255,255,.08); font-size: 15px; }
  .split .snm { text-align: left; font-weight: 600; min-width: 0; }
  .split .snm small { display: block; font-weight: 500; font-size: 12px; color: var(--ink2); }
  .splithead.vs, .split.vs { grid-template-columns: 1fr 74px 74px; }
  details.pay { border-top: 1px solid var(--hair); }
  details.pay summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 10px 0; cursor: pointer; }

/* ---------- colors (Settings) ---------- */
const LOCKED = { yale: '#4169E1', crew: '#F88379' };
const DEFAULT_COLORS = { 'Rent & Utilities': '#9085e9', 'Groceries': '#199e70', 'Dining & Drinks': '#c98500', 'Subscriptions': '#4fb3d9',
  'Transportation': '#d95926', 'Health': '#e66767', 'Shopping & Fun': '#d55181', 'Aquarium': '#2bb3a3', 'Amazon/Chase Card': '#a8814f', 'Other': '#8e8e93',
  'P2P In': '#30d158', 'Rewards & Daily Cash': '#c9a227', 'Other Income': '#7fbf9a', 'Savings Transfer': '#8e8e93', 'Card Payment': '#8e8e93' };
let PREFS = { colors: {} };
const empOf = s => /cbey/i.test(s) ? 'cbey' : /crew/i.test(s) ? 'crew' : /\byale\b|\bsas\b/i.test(s) ? 'sas' : '';
function catColor(c) { const e = empOf(c || ''); if (e) return e === 'crew' ? LOCKED.crew : LOCKED.yale; return (PREFS.colors || {})[c] || DEFAULT_COLORS[c] || '#8e8e93'; }
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
const tint = col => `background:${hexA(col, .2)};box-shadow:inset 0 0 0 1px ${hexA(col, .45)}`;
const logoAv = (k, cls) => `<span class="av logo ${cls || ''}"><img src="${LOGO[k]}" alt=""></span>`;
function avatarFor(cat, merchant, cls) {
  const e = empOf((cat || '') + ' ' + (merchant || ''));
  if (e) return logoAv(e, cls);
  return `<span class="av ${cls || ''}" style="${tint(catColor(cat))}">${emoji(cat)}</span>`;
}

/* ---------- peek: hover (or press and hold) for a dimmed detail card ---------- */
const PK = new Map(); let pkN = 0, pkTimer = null, pkPinned = false, pkLong = false, pkPress = null;
function pk(o) { const id = 'p' + (++pkN); PK.set(id, o); return `data-pk="${id}"`; }
const longDate = s => { if (!s) return ''; const d = s instanceof Date ? s : parseDay(s); return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }); };
function showPeek(el, pin) {
  const o = PK.get(el.dataset.pk); if (!o) return;
  const box = $('peek');
  box.innerHTML = `<div class="pk-t">${esc(o.title || '')}</div>
    ${o.date ? `<div class="pk-d">${esc(typeof o.date === 'string' && !/^\d{4}-\d{2}-\d{2}$/.test(o.date) ? o.date : longDate(o.date))}</div>` : ''}
    ${o.amount != null ? `<div class="pk-a num ${o.sign > 0 ? 'inc' : ''}">${o.sign > 0 ? '+' : o.sign < 0 ? '−' : ''}${money2(Math.abs(o.amount))}</div>` : ''}
    ${o.desc ? `<div class="pk-s">${o.desc}</div>` : ''}
    ${o.more && o.more.length ? `<button class="pk-x">Details</button><div class="pk-m">${o.more.filter(r => r[1] !== '' && r[1] != null).map(([k, v]) => `<span>${esc(k)}</span><b>${esc(v)}</b>`).join('')}</div>` : ''}`;
  const x = box.querySelector('.pk-x'); if (x) x.onclick = e => { e.stopPropagation(); box.classList.toggle('open'); pkPinned = true; place(); };
  const place = () => {
    const r = el.getBoundingClientRect(), bw = Math.min(300, innerWidth - 24); box.style.width = bw + 'px';
    const bh = box.offsetHeight, below = r.bottom + 8 + bh < innerHeight - 90;
    box.style.left = Math.max(12, Math.min(innerWidth - bw - 12, r.left + r.width / 2 - bw / 2)) + 'px';
    box.style.top = (below ? r.bottom + 8 : Math.max(12, r.top - bh - 8)) + 'px';
  };
  box.classList.remove('open'); box.classList.add('on'); place();
  $('peekDim').classList.add('on'); pkPinned = !!pin; el.classList.add('pk-on'); PK.cur = el;
}
function hidePeek() { $('peek').classList.remove('on', 'open'); $('peekDim').classList.remove('on'); pkPinned = false; if (PK.cur) PK.cur.classList.remove('pk-on'); PK.cur = null; }
document.addEventListener('pointerover', e => { if (e.pointerType !== 'mouse') return; const el = e.target.closest('[data-pk]'); clearTimeout(pkTimer);
  if (el) pkTimer = setTimeout(() => showPeek(el), 260); });
document.addEventListener('pointerout', e => { if (e.pointerType !== 'mouse') return; clearTimeout(pkTimer); const to = e.relatedTarget;
  if (!pkPinned && !(to && (to.closest('#peek') || to.closest('[data-pk]') === PK.cur))) hidePeek(); });
document.addEventListener('pointerdown', e => { const el = e.target.closest('[data-pk]'); if (!el || e.pointerType === 'mouse') return;
  pkLong = false; pkPress = setTimeout(() => { pkLong = true; showPeek(el, true); if (navigator.vibrate) navigator.vibrate(8); }, 420); });
['pointerup', 'pointercancel', 'pointermove'].forEach(t => document.addEventListener(t, e => { if (t !== 'pointermove' || Math.abs(e.movementY) + Math.abs(e.movementX) > 6) clearTimeout(pkPress); }));
document.addEventListener('click', e => {
  if (pkLong) { pkLong = false; e.stopPropagation(); e.preventDefault(); return; }
  const el = e.target.closest('[data-pk][data-pktap]'); if (el) { e.stopPropagation(); showPeek(el, true); }
}, true);
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-pk]')) e.preventDefault(); });

const INFO = {
  safe: ['Safe to spend', `<p>The most you can spend each month on everyday things (rent, food, subscriptions, transport, shopping and so on) while still:</p>
    <ul><li>keeping your savings above your <b>floor</b> every single month,</li><li>paying every <b>goal</b> and every <b>one-off on your Plan tab</b> in full by its date,</li><li>ending the plan with at least your <b>end balance</b>.</li></ul>

/* ---------- month calendar: paydays in green ---------- */
function monthCal(key) {
  const [y, m] = key.split('-').map(Number), first = new Date(y, m - 1, 1), dim = new Date(y, m, 0).getDate();
  const today = D ? parseDay(D.today) : new Date(), pays = {};
  const add = (d, o) => (pays[d] = pays[d] || []).push(o);
  if (MD && !MD.error) {
    (MD.payHistory || []).filter(p => p.date.slice(0, 7) === key).forEach(p => add(+p.date.slice(8), { who: p.employer, net: p.net, gross: p.gross, hours: p.hours, actual: true }));
    model().pays.filter(p => mkey(p.date) === key).forEach(p => add(p.date.getDate(), { who: p.employer, net: p.net, gross: p.gross, hours: p.employer === 'yale' ? p.h.sas + p.h.cbey : p.h.crew, season: p.season }));
  }
  const spend = {}, top = {};
  TXS.filter(x => !x.hist && x.k === 'Expense' && mkey(x.d) === key).forEach(x => { const d = x.d.getDate(); spend[d] = (spend[d] || 0) + x.a; (top[d] = top[d] || []).push(x); });
  const bills = {}; if (F && !F.error && key === mkey(today)) F.upcoming.forEach(u => { if (u.date.slice(0, 7) === key) (bills[+u.date.slice(8)] = bills[+u.date.slice(8)] || []).push(u); });
  const total = sum(Object.values(pays).flat(), p => p.net);
  const full = (D && D.months || []).filter(x => !x.partial && x.spent > 0), avgDay = full.length ? sum(full, x => x.spent) / full.length / 30.44 : 100;
  const heat = v => v > 0 ? Math.min(.62, .07 + .5 * v / (avgDay * 2)) : 0;
  let cells = '';
  for (let i = 0; i < first.getDay(); i++) cells += '<span class="cd blank"></span>';
  for (let d = 1; d <= dim; d++) {
    const date = new Date(y, m - 1, d), ps = pays[d] || [], isT = +date === +today, future = date > today;
    const net = sum(ps, p => p.net);
    const desc = [ps.map(p => `${p.who === 'crew' ? 'CREW Carbon' : 'Yale'} paycheck <b class="inc">+${money2(p.net)}</b>${p.hours ? ` · ${+(+p.hours).toFixed(2)} h` : ''}${p.actual ? ' · actual' : ' · projected'}`).join('<br>'),
      (top[d] || []).sort((a, b) => b.a - a.a).slice(0, 4).map(x => `${esc(x.m)} −${money2(x.a)}`).join('<br>'),
      (bills[d] || []).map(u => `${u.type === 'bill' ? 'Bill' : 'Plan'}: ${esc(u.title)} −${money(u.amount)}`).join('<br>')].filter(Boolean).join('<br><br>');
    const hv = heat(spend[d] || 0);
    cells += `<span class="cd ${ps.length ? 'pay' : ''} ${isT ? 'today' : ''} ${future ? 'fut' : ''}" ${hv ? `style="background:rgba(255,69,58,${hv.toFixed(3)})"` : ''} ${desc ? pk({ title: ps.length ? 'Payday' : 'Day', date, desc }) + ' data-pktap="1"' : ''}>
      <i>${d}</i>${ps.length ? `<b class="num">+${net >= 1000 ? (net / 1000).toFixed(1) + 'k' : Math.round(net)}</b><span class="dots">${ps.map(p => `<u style="background:${p.who === 'crew' ? LOCKED.crew : LOCKED.yale}"></u>`).join('')}</span>`
        : spend[d] ? `<em class="num">${Math.round(spend[d])}</em>` : (bills[d] ? '<em>•</em>' : '')}</span>`;
  }
  return `<div class="mcal"><div class="mcal-h"><b>${esc(first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }))}</b><span class="inc num">${total ? '+' + money(total) + ' pay' : ''}</span></div>
    <div class="mcal-w">${'SMTWTFS'.split('').map(c => `<span>${c}</span>`).join('')}</div><div class="mcal-g">${cells}</div>
    <div class="mcal-l"><span><u class="g"></u>Payday</span><span><u style="background:${LOCKED.yale}"></u>Yale</span><span><u style="background:${LOCKED.crew}"></u>CREW</span><span><u style="background:linear-gradient(90deg,rgba(255,69,58,.08),rgba(255,69,58,.62));width:22px;border-radius:3px"></u>spending vs your average day (${money(avgDay)})</span></div></div>`;
}

        <span>${proj != null ? `<span class="soft ${over ? 'warm' : 'cool'}">${over ? 'about ' + money(proj - T.budget) + ' above budget' : 'on track'}</span>` : ''}<span class="chev"></span></span>
      </button>
    </section>
    ${D.cash && D.cash.after != null ? `
    <section class="glass panel" style="display:flex;justify-content:space-between;align-items:center">

      <div style="text-align:right"><div class="kpi-l">Owed on cards</div><div class="kpi-v num">${money(D.cash.owed)}</div></div>

}

/* ---------- shared chart helpers ---------- */
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v / p * 2) / 2 * p; }
function svgEl(w, h, inner) { return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img">${inner}</svg>`; }
function rbar(cx, bw, top, bot) { const r = Math.min(4, Math.max(0, (bot - top) / 2));
  return `M${cx - bw / 2} ${bot} V${top + r} Q${cx - bw / 2} ${top} ${cx - bw / 2 + r} ${top} H${cx + bw / 2 - r} Q${cx + bw / 2} ${top} ${cx + bw / 2} ${top + r} V${bot} Z`; }
const addD = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const pad2 = n => String(n).padStart(2, '0');
const mkey = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const sum = (arr, f) => arr.reduce((s, x) => s + (f ? f(x) : x), 0);

function attachTip(box, w, n, xOf, html, onTap) {
  const tip = document.createElement('div'); tip.className = 'tip'; box.appendChild(tip);
  const line = box.querySelector('.cross');
  const idx = ev => { const r = box.getBoundingClientRect(); const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    let best = 0, bd = 1e9; for (let i = 0; i < n; i++) { const d = Math.abs(xOf(i) - x); if (d < bd) { bd = d; best = i; } } return best; };
  const show = i => { if (!html) return; tip.innerHTML = html(i); tip.style.opacity = 1;
    const tw = tip.offsetWidth; tip.style.left = Math.max(0, Math.min(w - tw, xOf(i) - tw / 2)) + 'px';
    if (line) { line.setAttribute('x1', xOf(i)); line.setAttribute('x2', xOf(i)); line.style.opacity = 1; } };
  const out = () => { tip.style.opacity = 0; if (line) line.style.opacity = 0; };
  box.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') show(idx(e)); });
  box.addEventListener('pointerdown', e => show(idx(e)));
  box.addEventListener('pointerleave', out);
  box.addEventListener('touchend', () => setTimeout(out, 1600));
  if (onTap) box.addEventListener('click', e => onTap(idx(e)));
}

/* ---------- activity (week / month / year) ---------- */
const A = { mode: 'M', off: 0, sel: null, cat: null };
let TXS = [];

function period(mode, off) {
  const t = parseDay(D.today);
  if (mode === 'W') {
    const s = new Date(t.getFullYear(), t.getMonth(), t.getDate() - t.getDay() + 7 * off), e = addD(s, 7);
    const lbl = `${MON[s.getMonth()]} ${s.getDate()} – ${s.getMonth() === addD(e, -1).getMonth() ? '' : MON[addD(e, -1).getMonth()] + ' '}${addD(e, -1).getDate()}`;
    const yr = addD(e, -1).getFullYear() !== t.getFullYear() || s.getFullYear() !== t.getFullYear() ? `, ${addD(e, -1).getFullYear()}` : '';
    return { s, e, n: 7, idx: d => Math.round((d - s) / 864e5), lab: i => 'SMTWTFS'[i], full: i => addD(s, i).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: addD(s, i).getFullYear() === t.getFullYear() ? undefined : 'numeric' }), label: off === 0 ? 'This Week' : off === -1 ? 'Last Week' : lbl + yr, prevWord: off === 0 ? 'last week' : 'the week before' };
  }
  if (mode === 'M') {
    const s = new Date(t.getFullYear(), t.getMonth() + off, 1), e = new Date(s.getFullYear(), s.getMonth() + 1, 1), n = Math.round((e - s) / 864e5);
    return { s, e, n, idx: d => d.getDate() - 1, lab: i => [0, 7, 14, 21, 28].includes(i) ? String(i + 1) : '', full: i => `${MON[s.getMonth()]} ${i + 1}`,
             label: s.toLocaleDateString('en-US', { month: 'long', year: s.getFullYear() === t.getFullYear() ? undefined : 'numeric' }), prevWord: MON[addD(s, -1).getMonth()] + (addD(s, -1).getFullYear() !== t.getFullYear() ? ' ' + addD(s, -1).getFullYear() : '') };
  }
  const s = new Date(t.getFullYear() + off, 0, 1), e = new Date(s.getFullYear() + 1, 0, 1);
  return { s, e, n: 12, idx: d => d.getMonth(), lab: i => MON[i][0], full: i => `${MON[i]} ${s.getFullYear()}`, label: String(s.getFullYear()), prevWord: String(s.getFullYear() - 1) };
}

function inPeriod(p, f) { return TXS.filter(t => t.d >= p.s && t.d < p.e && (!f || f(t))); }

function renderActivity() {
  const el = $('s-activity');
  const p = period(A.mode, A.off), t = parseDay(D.today);
  const isNow = A.off === 0, todayIdx = isNow ? p.idx(t) : p.n - 1;
  const spend = inPeriod(p, x => x.k === 'Expense'), inc = inPeriod(p, x => x.k === 'Income');
  const buckets = new Array(p.n).fill(0); spend.forEach(x => buckets[p.idx(x.d)] += x.a);
  const sel = A.sel, inSel = x => sel == null || p.idx(x.d) === sel;
  const total = sum(spend.filter(inSel), x => x.a), income = sum(inc.filter(inSel), x => x.a);
  const pp = period(A.mode, A.off - 1);
  const prev = sum(inPeriod(pp, x => x.k === 'Expense' && (!isNow || pp.idx(x.d) <= todayIdx)), x => x.a);
  const first = TXS.length ? TXS[TXS.length - 1].d : t, canBack = pp.e > first;
  const elapsed = Math.max(1, Math.min(p.n, todayIdx + 1));
  const avg = sum(buckets.slice(0, elapsed)) / elapsed;

  const cats = {}; spend.filter(inSel).forEach(x => { const k = x.c || 'Needs category'; cats[k] = (cats[k] || 0) + x.a; });
  const catList = Object.entries(cats).sort((a, b) => b[1] - a[1]);
  const cmax = catList.length ? catList[0][1] : 1;
  const list = TXS.filter(x => x.d >= p.s && x.d < p.e && inSel(x) && (!A.cat || (x.c || 'Needs category') === A.cat)).slice(0, 40);
  const diff = total - prev;

  el.innerHTML = `
    <div class="seg glass" role="tablist">${['Y', 'M', 'W'].map(m => `<button class="${A.mode === m ? 'on' : ''}" data-m="${m}">${{ W: 'Week', M: 'Month', Y: 'Year' }[m]}</button>`).join('')}</div>
    <div class="pnav"><button ${canBack ? '' : 'disabled'} data-d="-1" aria-label="Previous">‹</button><span>${esc(p.label)}</span><button ${A.off < 0 ? '' : 'disabled'} data-d="1" aria-label="Next">›</button></div>
    <section class="glass panel">
      <div class="eyebrow">${sel != null ? esc(p.full(sel)) : 'Spent'}</div>
      <div class="hero-num num" style="margin-top:8px">${money(total)}</div>
      <div class="hero-sub">${sel != null ? `Tap the bar again to see all of ${esc(p.label)}` :
        [prev ? `<span class="${diff > 0 ? 'upc' : 'downc'}">${diff > 0 ? '▲' : '▼'} ${money(Math.abs(diff))}</span> vs ${esc(p.prevWord)}${isNow ? ' at this point' : ''}` : '',
         income ? `<span style="color:var(--good)">+${money(income)} in</span>` : ''].filter(Boolean).join(' · ') || '&nbsp;'}</div>
      <div class="chart" id="actChart" style="margin-top:14px"></div>
      ${spend.length && spend.every(x => x.hist) ? '<div class="small faint" style="margin-top:6px">Monthly totals from Old Model (year 1)</div>' : ''}
    </section>
    <section class="glass panel">
      <div class="ph"><h2>Categories</h2>${A.cat ? `<button class="aside linkb" data-clear="1">Show all</button>` : ''}</div>
      ${catList.length ? catList.map(([c, v]) => `<div class="catwrap ${A.open === c ? 'open' : ''}"><button class="catrow ${A.cat === c || A.open === c ? 'on' : ''}" data-cat="${esc(c)}" ${pk({ title: c, amount: v, sign: -1, desc: `${Math.round(v / (total || 1) * 100)}% of ${esc(sel != null ? p.full(sel) : p.label)} spending` })}>${avatarFor(c, '', 'sm')}
        <span class="cmid"><span class="crow"><span class="nm">${esc(c)}</span><b class="num">${money(v)}</b></span>
        <span class="bar" style="margin:6px 0 0"><span style="display:block;height:100%;border-radius:4px;background:${catColor(c)};width:${v / cmax * 100}%"></span></span>
        <span class="small muted">${Math.round(v / (total || 1) * 100)}%${A.mode !== 'Y' ? ` · ${spend.filter(x => inSel(x) && (x.c || 'Needs category') === c).length} purchases` : ''}</span></span>${A.mode !== 'Y' ? '<span class="cchev"></span>' : ''}</button>
        ${A.mode !== 'Y' && A.open === c ? `<div class="catx">${spend.filter(x => inSel(x) && (x.c || 'Needs category') === c).sort((x, y) => y.d - x.d).map(x => txRow({ date: ymdOf(x.d), merchant: x.m, amount: x.a, category: x.c, kind: x.k, account: x.acct, note: x.n })).join('')}</div>` : ''}</div>`).join('') : '<div class="muted small">No spending in this period.</div>'}
    </section>
    ${A.mode === 'M' ? `<section class="glass panel">${monthCal(mkey(p.s))}</section>` : ''}
    ${A.mode === 'M' && sel == null ? `<section class="glass panel"><div class="ph"><h2>Spending pace</h2><span class="aside">vs ${esc(p.prevWord)}</span></div>
      <div class="legend"><span><i style="background:var(--s1)"></i>${esc(MON[p.s.getMonth()])}</span><span><i style="background:var(--ink3)"></i>${esc(p.prevWord)}</span><span><i class="dash"></i>Budget pace</span></div>
      <div class="chart" id="paceChart"></div></section>` : ''}
    ${A.mode === 'Y' && sel == null ? `<section class="glass panel"><div class="ph"><h2>Spent vs income</h2></div>
      <div class="legend"><span><i class="sq" style="background:var(--s1)"></i>Spent</span><span><i class="sq" style="background:var(--s3)"></i>Income</span></div>
      <div class="chart" id="yearChart"></div></section>
      <section class="glass panel"><div class="ph"><h2>When you spend</h2><span class="aside">everyday, last 90 days</span></div><div class="chart" id="wdChart"></div></section>` : ''}
    <section class="glass panel">
      <div class="ph"><h2>${A.cat ? esc(A.cat) : 'Transactions'}</h2><span class="aside">${list.length >= 40 ? 'latest 40' : list.length + ' total'}</span></div>
      ${list.length ? list.map(x => txRow({ date: ymdOf(x.d), merchant: x.m, amount: x.a, category: x.c, kind: x.k, account: x.acct, note: x.n })).join('') : '<div class="muted small">Nothing here.</div>'}
    </section>`;

  el.querySelectorAll('.seg button').forEach(b => b.onclick = () => { A.mode = b.dataset.m; A.off = 0; A.sel = null; A.cat = null; A.open = null; renderActivity(); });
  el.querySelectorAll('.pnav button').forEach(b => b.onclick = () => { A.off += +b.dataset.d; A.sel = null; A.cat = null; A.open = null; renderActivity(); });
  el.querySelectorAll('.catrow').forEach(b => b.onclick = () => {
    if (A.mode === 'Y') A.cat = A.cat === b.dataset.cat ? null : b.dataset.cat;
    else A.open = A.open === b.dataset.cat ? null : b.dataset.cat;
    renderActivity(); });
  const clr = el.querySelector('[data-clear]'); if (clr) clr.onclick = () => { A.cat = null; renderActivity(); };
  drawActBars(buckets, p, avg, todayIdx, isNow);
  if (A.mode === 'M' && sel == null) drawPace(p);
  if (A.mode === 'Y' && sel == null) { drawYear(p); drawWeekdays(); }
  swipe(el.querySelector('#actChart'), dir => { const n = A.off + dir; if (n > 0 || (dir < 0 && !canBack)) return; A.off = n; A.sel = null; A.cat = null; renderActivity(); });
}
const ymdOf = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

function swipe(node, fn) {
  let x0 = null, y0 = null;
  node.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  node.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) fn(dx < 0 ? 1 : -1); x0 = null; });
}

function drawActBars(vals, p, avg, todayIdx, isNow) {
  const box = $('actChart'); const w = box.clientWidth || 320, h = 170, padB = 20, padT = 10, padR = 34;
  const max = niceMax(Math.max(...vals, avg) * 1.05), y = v => padT + (h - padT - padB) * (1 - v / max);
  const gw = (w - padR) / p.n, bw = Math.max(3, Math.min(22, gw * .62));
  box.innerHTML = svgEl(w, h, `
    <line x1="0" x2="${w - padR}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(255,255,255,.12)"/>
    <line x1="0" x2="${w - padR}" y1="${y(max)}" y2="${y(max)}" stroke="rgba(255,255,255,.06)"/>
    <text x="${w}" y="${y(max) + 4}" text-anchor="end" font-size="11" fill="var(--ink3)">${money(max)}</text>
    ${avg > 0 ? `<line x1="0" x2="${w - padR}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="${w}" y="${y(avg) + 4}" text-anchor="end" font-size="11" fill="var(--good)">avg</text>` : ''}
    ${vals.map((v, i) => { const cx = gw * i + gw / 2, future = isNow && i > todayIdx;
      const on = A.sel == null ? true : A.sel === i;
      return `${v > 0 ? `<path d="${rbar(cx, bw, y(v), y(0))}" fill="var(--s1)" opacity="${on ? 1 : .3}"/>` : future ? '' : `<rect x="${cx - bw / 2}" y="${y(0) - 2}" width="${bw}" height="2" rx="1" fill="rgba(255,255,255,.15)"/>`}
        <text x="${cx}" y="${h - 4}" text-anchor="middle" font-size="11" fill="${i === todayIdx && isNow ? 'var(--ink)' : 'var(--ink3)'}">${p.lab(i)}</text>`; }).join('')}`);
  attachTip(box, w, p.n, i => gw * i + gw / 2, i => `<b>${esc(p.full(i))}</b>${money(vals[i])} spent`,
    i => { A.sel = A.sel === i ? null : i; A.cat = null; renderActivity(); });
}

function drawPace(p) {
  const box = $('paceChart'); if (!box) return;
  const w = box.clientWidth || 320, h = 170, padL = 44, padB = 22, padT = 12;
  const dim = p.n, B = D.totals.budget, t = parseDay(D.today);
  const cum = (s, n, upto) => { const a = new Array(n).fill(0); TXS.forEach(x => { if (x.k === 'Expense' && x.d >= s && x.d < addD(s, n)) a[x.d.getDate() - 1] += x.a; });
    for (let i = 1; i < n; i++) a[i] += a[i - 1]; return a.slice(0, upto); };
  const ps = new Date(p.s.getFullYear(), p.s.getMonth() - 1, 1), pn = Math.round((p.s - ps) / 864e5);
  const isNow = A.off === 0;
  const thisM = cum(p.s, dim, isNow ? t.getDate() : dim), last = cum(ps, pn, pn).slice(0, dim);
  const max = niceMax(Math.max(B, ...last, ...thisM) * 1.02);
  const x = d => padL + (w - padL - 4) * (d - 1) / (dim - 1), y = v => padT + (h - padT - padB) * (1 - v / max);
  const path = arr => arr.map((v, i) => (i ? 'L' : 'M') + x(i + 1).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const grid = [0, .5, 1].map(f => `<line x1="${padL}" x2="${w}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="rgba(255,255,255,.07)"/>
    <text x="${padL - 8}" y="${y(max * f) + 4}" text-anchor="end" font-size="11" fill="var(--ink3)">${money(max * f)}</text>`).join('');
  const m3 = MON[p.s.getMonth()];
  box.innerHTML = svgEl(w, h, `${grid}
    <line x1="${x(1)}" y1="${y(0)}" x2="${x(dim)}" y2="${y(B)}" stroke="var(--ink3)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="${path(last)}" fill="none" stroke="var(--ink3)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${path(thisM)}" fill="none" stroke="var(--s1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${thisM.length ? `<circle cx="${x(thisM.length)}" cy="${y(thisM[thisM.length - 1])}" r="5" fill="var(--s1)" stroke="#0b0c12" stroke-width="2"/>` : ''}
    <line class="cross" y1="${padT}" y2="${h - padB}" stroke="rgba(255,255,255,.35)" stroke-width="1" style="opacity:0"/>
    ${[1, 15, dim].map(d => `<text x="${x(d)}" y="${h - 4}" text-anchor="${d === 1 ? 'start' : d === dim ? 'end' : 'middle'}" font-size="11" fill="var(--ink3)">${m3} ${d}</text>`).join('')}`);
  attachTip(box, w, dim, i => x(i + 1), i => `<b>${m3} ${i + 1}</b>
    ${i < thisM.length ? `<span class="k" style="background:var(--s1)"></span>${money(thisM[i])}<br>` : ''}
    ${i < last.length ? `<span class="k" style="background:var(--ink3)"></span>${esc(p.prevWord)}: ${money(last[i])}<br>` : ''}Pace: ${money(B * (i + 1) / dim)}`);
}

function drawYear(p) {
  const box = $('yearChart'); const w = box.clientWidth || 320, h = 150, padB = 22, padT = 8;
  const M = MON.map((m, i) => { const s = new Date(p.s.getFullYear(), i, 1), e = new Date(p.s.getFullYear(), i + 1, 1);
    const xs = TXS.filter(x => x.d >= s && x.d < e); return { label: m, spent: sum(xs.filter(x => x.k === 'Expense'), x => x.a), income: sum(xs.filter(x => x.k === 'Income'), x => x.a) }; });
  const max = niceMax(Math.max(1, ...M.map(m => Math.max(m.spent, m.income))) * 1.05);
  const gw = w / 12, bw = Math.min(9, gw / 3.2), y = v => padT + (h - padT - padB) * (1 - v / max);
  box.innerHTML = svgEl(w, h, `<line class="cross" y1="${padT}" y2="${h - padB}" stroke="rgba(255,255,255,.08)" stroke-width="${gw - 4}" style="opacity:0"/>
    <line x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(255,255,255,.12)"/>
    ${M.map((m, i) => { const cx = gw * i + gw / 2;
      return (m.spent > 0 ? `<path d="${rbar(cx - bw / 2 - 1, bw, y(m.spent), y(0))}" fill="var(--s1)"/>` : '') + (m.income > 0 ? `<path d="${rbar(cx + bw / 2 + 1, bw, y(m.income), y(0))}" fill="var(--s3)"/>` : '') +
      `<text x="${cx}" y="${h - 4}" text-anchor="middle" font-size="11" fill="var(--ink3)">${m.label[0]}</text>`; }).join('')}`);
  attachTip(box, w, 12, i => gw * i + gw / 2, i => { const m = M[i]; return `<b>${m.label} ${p.s.getFullYear()}</b><span class="k" style="background:var(--s1)"></span>Spent ${money(m.spent)}<br><span class="k" style="background:var(--s3)"></span>Income ${money(m.income)}<br>Net ${money(m.income - m.spent)}`; });
}

function drawWeekdays() {
  const box = $('wdChart'); if (!box) return; const w = box.clientWidth || 320, h = 120, padB = 20, padT = 22;
  const order = [1, 2, 3, 4, 5, 6, 0], L = ['M', 'T', 'W', 'T', 'F', 'S', 'S'], full = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const vals = order.map(i => D.weekdays[i]), max = Math.max(...vals, 1);
  const gw = w / 7, bw = Math.min(26, gw * .55), y = v => padT + (h - padT - padB) * (1 - v / max);
  box.innerHTML = svgEl(w, h, vals.map((v, k) => { const cx = gw * k + gw / 2, isMax = v === max;
    return `<path d="${rbar(cx, bw, y(v), y(0))}" fill="var(--s1)" opacity="${isMax ? 1 : .45}"/>
      ${isMax ? `<text x="${cx}" y="${y(v) - 6}" text-anchor="middle" font-size="11" fill="var(--ink)">${money(v)}</text>` : ''}
      <text x="${cx}" y="${h - 4}" text-anchor="middle" font-size="11" fill="var(--ink3)">${L[k]}</text>`; }).join(''));
  attachTip(box, w, 7, k => gw * k + gw / 2, k => `<b>${full[order[k]]}s</b>Average ${money(vals[k])}`);
}

/* ---------- plan: the model ---------- */
let MD = null; const IN = {}; let BASE = null;
const P = { view: 'overview', month: null };
const lookup = (t, v) => { let r = t[0]; for (const row of t) { if (row[0] <= v) r = row; else break; } return r; };
const SEASONS = [['school', 'School weeks', '19 h Yale cap'], ['recess', 'Recess weeks', 'up to 40 h at Yale'], ['summer', 'Summer', 'up to 40 h · FICA'], ['after', 'After Yale', 'from Sep 2027']];
const inR = (d, rs) => rs.some(([a, b]) => d >= parseDay(a) && d <= parseDay(b));
function seasonOf(day) {
  const C = MD.yaleCal;
  if (day > parseDay(C.end)) return 'after';
  if (inR(day, C.summer)) return 'summer';
  if (inR(day, C.recess)) return 'recess';
  return 'school';

function payGrid() {

/* ---------- forecast ---------- */
function renderForecast() {
  const el = $('pv');
  if (!el || P.view !== 'now') return;
  if (!F) { el.innerHTML = '<div class="sk" style="height:260px;margin-bottom:14px"></div><div class="sk" style="height:200px"></div>'; return; }
  if (F.error) { el.innerHTML = `<div class="glass err">Couldn't build the forecast: ${esc(F.error)}</div>`; return; }
  const safe = MD && !MD.error ? model().sol.S : null, more = F.projected - F.spent;
  const ref = safe != null ? safe : F.budget, scale = Math.max(F.projected, ref) * 1.04, diff = F.projected - ref;
  const seg = [['Spent so far', F.spent, 'var(--s1)', 'Everything logged in Transactions this month', 'Logged through today'],
               ['Bills still due', F.billsLeft, 'var(--s3)', F.upcoming.filter(u => u.type === 'bill' && u.inMonth).map(u => `${esc(u.title)} ${money(u.amount)} · ${esc(shortD(parseDay(u.date)))}`).join('<br>') || 'None left', `${F.billsCount} bill${F.billsCount === 1 ? '' : 's'} before ${F.lastDay}`],
               ['Everyday spending', F.pace, '#9085e9', `Your average day over the last ${F.baselineDays} days (not counting bills or one-off projects) is ${money(F.daily)}. × ${F.restDays} days left.`, `about ${money(F.daily)} a day`],
               ['Calendar plans', F.plans, 'var(--s4)', F.upcoming.filter(u => u.type === 'event' && u.inMonth).map(u => `${esc(u.title)} ${money(u.amount)} · ${esc(u.basis)}`).join('<br>') || 'Nothing on your calendar with a cost', F.calendarError ? 'Calendar not connected' : `${F.plansCount} event${F.plansCount === 1 ? '' : 's'} with a cost`]];
  const groups = {};
  F.upcoming.forEach(it => (groups[it.date] = groups[it.date] || []).push(it));
  const dayLabel = s => { const d = parseDay(s); const t = D ? parseDay(D.today) : new Date(); const n = Math.round((d - t) / 864e5);
    return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); };
  el.innerHTML = `
    <section class="glass panel calm">
      <div class="ph"><span class="eyebrow">${esc(F.month)} so far</span>${ibtn('month')}</div>
      <div class="hero-num num">${money(F.spent)}</div>
      <div class="hero-sub">spent · about <b style="color:var(--ink)">${money(more)}</b> more expected by ${esc(F.lastDay)}</div>
      <div class="calm-bar" role="img" aria-label="Likely ${money(F.projected)} for the month">
        ${seg.map(s => s[1] > 0 ? `<div style="width:${s[1] / scale * 100}%;background:${s[2]}" ${pk({ title: s[0], amount: s[1], desc: s[3] })}></div>` : '').join('')}
        <div class="mark" style="left:${ref / scale * 100}%"><span>${safe != null ? 'Safe' : 'Budget'} ${money(ref)}</span></div>
      </div>
      <div class="calm-total"><span>Likely total</span><b class="num">${money(F.projected)}</b></div>
      <p class="calm-note">${diff > 0
        ? `That's about <b>${money(diff)}</b> more than your ${safe != null ? 'safe amount' : 'budget'} for ${esc(F.month)}. ${ref - F.spent - F.billsLeft > 0
            ? `After bills, about <b>${money((ref - F.spent - F.billsLeft) / Math.max(1, F.restDays))}</b> a day is left for everyday spending.`
            : `Bills still due use up the rest, so keep extras small. ${safe != null ? 'Next month’s safe amount already accounts for this.' : ''}`}`
        : `That fits inside your ${safe != null ? 'safe amount' : 'budget'} with about <b>${money(-diff)}</b> to spare.`}</p>
      <div style="margin-top:6px">
        ${seg.map(s => `<div class="brk" ${pk({ title: s[0], amount: s[1], desc: s[3] })}><span class="sw" style="background:${s[2]}"></span><div class="t">${esc(s[0])}<small>${esc(s[4])}</small></div><b class="num">${money(s[1])}</b></div>`).join('')}
      </div>
    </section>
    <section class="glass panel">${monthCal(mkey(D ? parseDay(D.today) : new Date()))}</section>
    <section class="glass panel">
      <div class="ph"><h2>Coming up</h2><span class="aside">next 30 days</span></div>
      ${F.upcoming.length ? Object.keys(groups).map(day => `<div class="dayhead">${esc(dayLabel(day))}</div>` + groups[day].map(it => `
        <div class="tx" ${pk({ title: it.title, date: it.date, amount: it.amount, sign: -1, desc: it.type === 'bill' ? `Recurring bill from the Accounts tab · paid from ${esc(it.sub || '')}` : `On your calendar${it.time ? ' at ' + esc(it.time) : ''}. Cost: ${esc(it.basis)}.`, more: [['Category', it.category]] })} data-pktap="1">
          ${it.type === 'bill' ? `<span class="av" style="${tint(catColor(it.category))}">🧾</span>` : avatarFor(it.category, it.title)}
          <div class="mid"><div class="m">${esc(it.title)}</div>
          <div class="s">${it.type === 'bill' ? `Bill · ${esc(it.sub || it.category)}` : `${esc(it.time)} · ${esc(it.basis)}`}</div></div>
          <div class="amt num">${money(it.amount)}</div></div>`).join('')).join('') : '<div class="muted small">Nothing with a cost in the next 30 days.</div>'}
      ${F.skipped ? `<div class="small faint" style="margin-top:10px">${F.skipped} other event${F.skipped === 1 ? '' : 's'} on your calendar with no spending expected.</div>` : ''}
    </section>
    <div class="glass tip-card">
      ${F.calendarError ? `<b>Calendar isn't connected yet.</b> ${esc(F.calendarError)}<br><br>` : `<b>Reading:</b> ${esc(F.calendarNames.join(', ') || 'no calendars')}<br><br>`}
      <b>Tip:</b> put an amount in an event title (<i>“Dinner with Sam $40”</i>) to set its cost exactly, or <i>$0</i> to leave it out.
    </div>`;
}

/* ---------- tabs ---------- */
function go(tab) {

  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));

}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));

/* ---------- add sheet ---------- */
function buildChips() {
  const cat = $('catChips'), acct = $('acctChips');
  cat.innerHTML = ['', ...D.categoryNames].map(c => `<button data-v="${esc(c)}" class="${c === S.cat ? 'on' : ''}">${c ? emoji(c) + ' ' + esc(c) : '✨ Auto'}</button>`).join('');

  cat.onclick = e => { const b = e.target.closest('button'); if (!b) return; S.cat = b.dataset.v; [...cat.children].forEach(x => x.classList.toggle('on', x === b)); };
  acct.onclick = e => { const b = e.target.closest('button'); if (!b) return; S.acct = b.dataset.v; [...acct.children].forEach(x => x.classList.toggle('on', x === b)); };
}
function openSheet() {
  $('date').value = D ? D.today : '';
  $('sheet').classList.add('on'); $('scrim').classList.add('on');
  setTimeout(() => $('amount').focus(), 350);
}
function closeSheet() { $('sheet').classList.remove('on'); $('scrim').classList.remove('on'); document.activeElement && document.activeElement.blur(); }
$('gear').onclick = openSettings; $('rvClose').onclick = closeReview; $('peekDim').onclick = hidePeek;
$('fab').onclick = openSheet; $('cancel').onclick = closeSheet; $('scrim').onclick = () => { closeSheet(); closeEd(); };
$('amount').addEventListener('input', e => { const v = e.target.value.replace(/[^0-9.]/g, ''); e.target.value = v ? '$' + v : ''; });

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }

function save() {
  const amount = $('amount').value.replace(/[^0-9.]/g, '');
  if (!amount || !(+amount > 0)) { toast('Enter an amount'); $('amount').focus(); return; }
  $('save').disabled = true; $('save2').disabled = true; $('save').textContent = 'Saving…';
  google.script.run.withSuccessHandler(res => {
    $('save').disabled = false; $('save2').disabled = false; $('save').textContent = 'Save';
    if (!res.ok) { toast(res.error || 'Could not save'); return; }
    toast(res.skipped ? res.reason : res.duplicate ? 'Already logged' : `Saved ${money2(res.amount)} · ${res.category}`);
    ['amount', 'merchant', 'note'].forEach(id => $(id).value = '');
    if (MODE !== 'sidebar') closeSheet();
    load();
  }).withFailureHandler(e => { $('save').disabled = false; $('save2').disabled = false; $('save').textContent = 'Save'; toast(e.message); })
    .apiAdd(sess(), { amount, merchant: $('merchant').value, category: S.cat, account: S.acct, note: $('note').value, date: $('date').value });
}
$('save').onclick = save; $('save2').onclick = save;

let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (D && MODE !== 'sidebar') { renderStack(); if (S.tab === 'activity') renderActivity(); if (S.tab === 'plan') renderPlan(); if (S.tab === 'savings') renderSavings(); } }, 150); });
/* ---------- lock: password, 3 minutes away before it locks again ---------- */
const LOCK_MS = 3 * 60 * 1000;
let SESSION = null, lastActive = Date.now();
function sess() { return MODE === 'sidebar' ? KEY : KEY + '|' + (SESSION || ''); }
const store = { get() { try { return JSON.parse(localStorage.getItem('money.lock') || 'null'); } catch (e) { return null; } },
  set(v) { try { v ? localStorage.setItem('money.lock', JSON.stringify(v)) : localStorage.removeItem('money.lock'); } catch (e) {} } };
function touch() { lastActive = Date.now(); if (SESSION) store.set({ s: SESSION, t: lastActive }); }
function lock(reason) {
  if (SESSION) google.script.run.apiLock(sess());
  SESSION = null; store.set(null); hidePeek(); closeEd(); closeSheet();
  document.body.classList.add('locked'); $('lock').classList.add('on');
  $('lkErr').textContent = reason || ''; PIN = ''; drawDots(); drawClock(); drawBio();
  if (bioStore.get()) setTimeout(bioUnlock, 450);
}
/* Face ID / Touch ID (works when the app is opened from GitHub Pages, not inside Google's frame) */
const BIO = { name: /iPhone|iPad/.test(navigator.userAgent) ? 'Face ID' : 'Touch ID' };
const bioStore = { get() { try { return JSON.parse(localStorage.getItem('money.bio') || 'null'); } catch (e) { return null; } },
  set(v) { try { v ? localStorage.setItem('money.bio', JSON.stringify(v)) : localStorage.removeItem('money.bio'); } catch (e) {} } };
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))), unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function bioAvailable() {
  try { if (!window.PublicKeyCredential || window.top !== window.self) return false;
    return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); } catch (e) { return false; }
}
function drawBio() { const b = $('lkBio'); const on = !!bioStore.get(); b.style.visibility = on ? 'visible' : 'hidden'; b.textContent = BIO.name; }
async function bioUnlock() {
  const b = bioStore.get(); if (!b || $('lock').dataset.busy) return;
  try { await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: unb64(b.id) }], userVerification: 'required', timeout: 60000 } }); }
  catch (e) { return; }   // cancelled or failed: the passcode is still there
  $('lock').dataset.busy = '1'; $('lkTitle').textContent = 'Unlocking';
  google.script.run.withSuccessHandler(r => {
    delete $('lock').dataset.busy; $('lkTitle').textContent = 'Enter Passcode';
    if (r.ok) { unlocked(r.session); return; }
    if (r.forget) bioStore.set(null); drawBio();
    $('lkErr').textContent = r.lockedOut ? 'Too many attempts. Try again in 15 minutes.' : `Use your passcode, then turn ${BIO.name} back on in Settings.`;
  }).withFailureHandler(e => { delete $('lock').dataset.busy; $('lkTitle').textContent = 'Enter Passcode'; $('lkErr').textContent = e.message; }).apiDeviceUnlock(KEY, b.tok);
}
async function enableBio() {
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'Atlas' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'Atlas', displayName: 'Atlas' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' }, timeout: 60000 } });
    google.script.run.withSuccessHandler(r => { bioStore.set({ id: b64(cred.rawId), tok: r.token }); toast(`${BIO.name} is on for this device`); })
      .withFailureHandler(e => toast(e.message)).apiTrustDevice(sess(), BIO.name + ' · ' + (navigator.platform || 'device'));
  } catch (e) { toast(`${BIO.name} wasn’t turned on`); }
}
async function offerBio() {
  if (bioStore.get() || !(await bioAvailable())) return;
  try { if (localStorage.getItem('money.bioAsked')) return; localStorage.setItem('money.bioAsked', '1'); } catch (e) { return; }
  const sh = $('edSheet');
  sh.innerHTML = `<div class="grab"></div><div class="bio-ask"><div class="bio-ic">${BIO.name === 'Face ID' ? '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 15V10a4 4 0 0 1 4-4h5M33 6h5a4 4 0 0 1 4 4v5M42 33v5a4 4 0 0 1-4 4h-5M15 42h-5a4 4 0 0 1-4-4v-5M17 18v3M31 18v3M24 19v8h-2M18 33c3.5 2.5 8.5 2.5 12 0"/></svg>' : '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M14 30c0-8 4-14 10-14s10 6 10 14M19 38c-1-3-1.5-6-1.5-8 0-4 2.5-8 6.5-8s6.5 4 6.5 8M24 30v10M10 22c2-8 7-12 14-12s12 4 14 12"/></svg>'}</div>
    <h3>Unlock with ${BIO.name}?</h3><p class="muted">Use ${BIO.name} instead of your passcode on this ${BIO.name === 'Face ID' ? 'iPhone' : 'Mac'}. Your passcode still works anytime.</p>
    <button class="save" id="bioYes">Turn On ${BIO.name}</button><button class="save ghost" id="bioNo">Not Now</button></div>`;
  $('bioYes').onclick = () => { closeEd(); enableBio(); }; $('bioNo').onclick = closeEd; openEd();
}
function unlocked(s) {
  SESSION = s; touch(); PIN = ''; setTimeout(offerBio, 900);
  $('lock').classList.add('leaving');
  setTimeout(() => { $('lock').classList.remove('on', 'leaving'); document.body.classList.remove('locked'); }, 450);
  load();
}
let PIN = '';
function drawDots() { $('lkCap').querySelectorAll('i').forEach((d, i) => d.classList.toggle('on', i < PIN.length)); $('lkDel').textContent = PIN.length ? 'Delete' : ''; }
function pressKey(d) {
  if (PIN.length >= 6 || $('lock').dataset.busy) return;
  PIN += d; drawDots(); $('lkErr').textContent = '';
  if (PIN.length === 6) tryUnlock();
}
function tryUnlock() {
  $('lock').dataset.busy = '1'; $('lkTitle').textContent = 'Checking';
  google.script.run.withSuccessHandler(r => {
    delete $('lock').dataset.busy; $('lkTitle').textContent = 'Enter Passcode';
    if (r.ok) { unlocked(r.session); return; }
    $('lkCap').classList.remove('shake'); void $('lkCap').offsetWidth; $('lkCap').classList.add('shake');
    setTimeout(() => { PIN = ''; drawDots(); }, 420);
    $('lkErr').textContent = r.lockedOut ? 'Too many attempts. Try again in 15 minutes.' : `Incorrect passcode · ${r.left} ${r.left === 1 ? 'try' : 'tries'} left`;
  }).withFailureHandler(err => { delete $('lock').dataset.busy; $('lkTitle').textContent = 'Enter Passcode'; PIN = ''; drawDots(); $('lkErr').textContent = err.message; }).apiUnlock(KEY, PIN);
}
function drawClock() {
  const n = new Date();
  $('lkTime').textContent = n.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M/, '');
  $('lkDate').textContent = n.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}
function boot() {
  if (MODE === 'sidebar') { load(); return; }
  document.querySelectorAll('.lk-k').forEach(b => b.onclick = () => pressKey(b.dataset.d));
  $('lkDel').onclick = () => { PIN = PIN.slice(0, -1); drawDots(); };
  $('lkBio').onclick = bioUnlock;
  if (!KEY) setTimeout(() => { $('lkErr').textContent = 'Open your personal setup link once on this device.'; }, 50);
  window.addEventListener('keydown', e => { if (!$('lock').classList.contains('on')) return;
    if (/^\d$/.test(e.key)) pressKey(e.key); else if (e.key === 'Backspace') { PIN = PIN.slice(0, -1); drawDots(); } });
  ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(t => window.addEventListener(t, () => { if (SESSION) touch(); }, { passive: true }));
  setInterval(() => { drawClock(); if (SESSION && Date.now() - lastActive > LOCK_MS) lock(); else if (SESSION && D && ymdOf(new Date()) !== D.today) load(); }, 10000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (SESSION) store.set({ s: SESSION, t: lastActive }); return; }
    if (SESSION && Date.now() - lastActive > LOCK_MS) lock(); else if (SESSION && D) { touch(); load(); }
  });
  const saved = store.get();
  if (saved && saved.s && Date.now() - saved.t < LOCK_MS) { document.body.classList.remove('locked'); $('lock').classList.remove('on'); unlocked(saved.s); }
  else lock();
}

renderForecast();
boot();
